# OrbitView settings. Edit, then Plugins > OrbitView > Reload config.ini.

# 1 = A/D, End, Shift+WASDQE, Shift+Space, Ctrl+Shift+Space are handled by OrbitView.
# 0 = only the orbitview/* commands (bind them yourself in Settings > Keyboard).
keyboard = 1

# Right-drag to look around / orbit.
mouse_pan = 1
mouse_sensitivity = 0.15
invert_mouse_y = 0

# Mouse wheel zoom outside the aircraft (zoom per wheel notch).
# In the cockpit the wheel and = / - use X-Plane's own zoom, which leaves knobs
# alone; it needs "mouse wheel zoom for internal views" on in X-Plane's settings.
wheel_step = 0.12

# Gamepad right stick. -1 = use whichever axes are assigned to
# "View left/right" and "View up/down" in X-Plane's joystick settings.
# Otherwise give the raw axis numbers shown in X-Plane's joystick settings.
stick_x_axis = -1
stick_y_axis = -1
stick_deadzone = 0.12
stick_rate = 120
invert_stick_y = 0

# Shift+WASDQE speed (metres/second in the cockpit; scaled by distance outside).
move_speed = 0.6

# How quickly the camera glides to a new view (higher = faster, 0 = instant cut).
smoothing = 6

# How quickly the camera catches up with mouse, keyboard and wheel input.
# Lower = smoother but floatier, higher = snappier. 0 = raw, unsmoothed.
input_smoothing = 15

# How quickly Shift+WASDQE movement ramps up and slows down (0 = instant start/stop).
move_accel = 6

# How quickly exterior views swing round to follow the aircraft's heading.
heading_follow = 2.5

# Camera effects, also set on Plugins > OrbitView > Preferences (which saves here).
# effects: 0 = off, 1 = on. effects_exterior: 1 = also shake exterior views.
# Strengths: 1 = default, 0 = none, 2 = double.
#   fx_gforce      head sways with acceleration, pull-ups and turns
#   fx_turbulence  jolts from bumpy air
#   fx_ground      runway rumble and a touchdown bump scaled by sink rate
effects = 0
effects_exterior = 1
fx_gforce = 1
fx_turbulence = 1
fx_ground = 1
