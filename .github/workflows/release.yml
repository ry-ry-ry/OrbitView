name: Release

# Builds on every push to main. When VERSION names a release that doesn't
# exist yet, publishes it with the plugin zip and that version's CHANGELOG.md
# section as the release notes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $tag = 'v' + (Get-Content VERSION -Raw).Trim()
          gh release view $tag *> $null
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "new=$($LASTEXITCODE -ne 0)" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Publish
        if: steps.version.outputs.new == 'True'
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $ver = [regex]::Escape($tag.Substring(1))
          $m = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## \[$ver\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "CHANGELOG.md has no section for $tag" }
          $m.Groups[1].Value.Trim() | Set-Content notes.md -Encoding utf8
          Copy-Item README.md, LICENSE, CHANGELOG.md build/OrbitView/
          Compress-Archive build/OrbitView "OrbitView-$tag.zip"
          gh release create $tag "OrbitView-$tag.zip" --title "OrbitView $tag" --notes-file notes.md --target $env:GITHUB_SHA
